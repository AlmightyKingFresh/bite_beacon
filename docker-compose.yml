services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bite_beacon_dev
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bite_beacon_dev
      MIX_ENV: dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      # Keep compiled artifacts and deps in named volumes rather than the
      # bind mount above -- they're built for Linux inside the container
      # and shouldn't mix with anything compiled on the host.
      - build_data:/app/_build
      - deps_data:/app/deps
      - node_modules_data:/app/assets/node_modules
    stdin_open: true
    tty: true

volumes:
  db_data:
  build_data:
  deps_data:
  node_modules_data:
